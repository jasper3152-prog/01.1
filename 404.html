        <script>
// 頂部搜尋列（topbar）
// search.js 已處理 globalSearchInput，不需要重複

// 頁面中間的內嵌搜尋
const inlineInput = document.getElementById("inlineSearchInput");
const inlineResults = document.getElementById("inlineSearchResults");

inlineInput.addEventListener("input", (e) => {
  const value = e.target.value.trim().toLowerCase();
  inlineResults.innerHTML = "";

  if (!value) {
    inlineResults.style.display = "none";
    return;
  }

  const filtered = searchData.filter(item =>
    item.name.toLowerCase().includes(value) ||
    item.category.toLowerCase().includes(value)
  );

  if (!filtered.length) {
    inlineResults.style.display = "block";
    inlineResults.innerHTML = '<div class="search-empty">沒有找到符合的條目。</div>';
    return;
  }

  inlineResults.style.display = "block";
  filtered.forEach(item => {
    const a = document.createElement("a");
    a.className = "search-result-item";
    a.href = item.url;
    a.innerHTML = `
      <strong>${item.name}</strong>
      <div class="search-result-meta">${item.category}</div>
      <div class="search-result-desc">${item.desc}</div>
    `;
    inlineResults.appendChild(a);
  });
});
</script>
