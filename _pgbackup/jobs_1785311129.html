<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>職業｜星河夢境新手教學指南</title>
        <meta name="description" content="星河夢境新手教學指南職業分類頁。"/>
        <style>
    :root {
      --bg: #eef1f5;
      --bg-page: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #f7f9fb;
      --panel-head: #e8edf4;
      --line: #cfd7e2;
      --line-strong: #bac5d3;
      --text: #1f2328;
      --text-soft: #4f5b6a;
      --muted: #7c8796;
      --primary: #2e3a49;
      --primary-2: #445268;
      --shadow: 0 2px 8px rgba(31, 35, 40, 0.06);
      --max-width: 1440px;
      --sidebar-width: 260px;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
    }

    a {
      color: var(--primary-2);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .site-shell {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: 100vh;
      background: var(--bg-page);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 16px 14px 24px;
      border-right: 1px solid var(--line);
      background: #f2f5f9;
    }

    .wiki-logo {
      margin-bottom: 14px;
      padding: 14px 14px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .wiki-logo small {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .wiki-logo h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      color: var(--primary);
    }

    .wiki-logo p {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--text-soft);
    }

    .side-box {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .side-box h3 {
      margin: 0;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      background: var(--panel-head);
      border-bottom: 1px solid var(--line);
    }

    .side-box .box-body {
      padding: 10px 12px;
    }

    .side-nav {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 6px;
    }

    .side-nav a {
      display: block;
      padding: 4px 0;
      font-size: 14px;
      color: var(--text-soft);
    }

    .side-nav a.active,
    .side-nav a:hover {
      color: var(--primary);
    }

    .content {
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .topbar-title {
      font-size: 14px;
      color: var(--text-soft);
    }

    .page-wrap {
      padding: 18px;
    }

    .page-title {
      margin: 0 0 4px;
      font-size: 30px;
      line-height: 1.2;
      color: var(--primary);
    }

    .page-subtitle {
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--text-soft);
    }

    .wiki-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .wiki-panel h2 {
      margin: 0;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      background: var(--panel-head);
      border-bottom: 1px solid var(--line);
    }

    .panel-body {
      padding: 14px;
    }

    .banner-box {
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px;
    }

    .banner-box img {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: #ddd;
    }

    .banner-note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .job-rows {
      display: grid;
      gap: 12px;
    }

    .job-row {
      display: grid;
      gap: 12px;
    }

    .job-row.row-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .job-row.row-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .job-card {
      display: block;
      border: 1px solid var(--line);
      background: #fff;
      padding: 14px;
      text-align: center;
      transition: 0.18s ease;
    }

    .job-card:hover {
      border-color: var(--line-strong);
      background: #fbfcfe;
      box-shadow: 0 6px 14px rgba(31, 35, 40, 0.05);
      text-decoration: none;
    }

    .job-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
      color: var(--primary);
    }

    .job-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .back-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
    }

    @media (max-width: 1120px) {
      .site-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }
    }

    @media (max-width: 820px) {
      .job-row.row-3,
      .job-row.row-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .page-wrap {
        padding: 14px;
      }

      .page-title {
        font-size: 24px;
      }

      .job-row.row-3,
      .job-row.row-4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
    </head>
